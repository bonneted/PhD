[metadata]
name = pinns-phd
version = 0.0.0
description = PINN thesis codebase and examples
author = Damien Bonnet-Eymard

[options]
packages = find:
install_requires =
    numpy
    scipy
    matplotlib
    jax
    jaxlib
    flax
    optax
    deepxde
    pandas
    scienceplots
    wandb
    jupyter
    hydra-core
    omegaconf

[options.packages.find]
where = src
exclude = tests

[options.package_data]
phd =
    io/dataset/*.mat
    io/dataset/side_loaded_plate/*.dat
    io/dataset/side_loaded_plate/*.csv
    io/dataset/side_loaded_plate/*.mesh
