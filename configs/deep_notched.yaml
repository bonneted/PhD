# Deep-notched plate problem - mapped computational domain configuration

problem:
  name: deep_notched

  geometry:
    x_max: 100.0
    y_max: 100.0
    notch_diameter: 50.0
    notch_height: 50.0

  mapping:
    nx: 60
    ny: 88
    force_recompute: false

  loading:
    pstress: 50.0

  reference:
    # Relative paths are resolved from src/phd/io/dataset
    dataset_by_material:
      isotropic: deep_notched/isotropic_100x100.dat
      orthotropic:
        by_theta_deg:
          0.0: deep_notched/orthotropic_100x100_0.0deg.dat
          45.0: deep_notched/orthotropic_100x100_45.0deg.dat
        default: deep_notched/orthotropic_100x100_45.0deg.dat

  material:
    law: isotropic  # isotropic or orthotropic

    isotropic:
      E: 52000.0
      nu: 0.3

    orthotropic:
      E1: 41000.0
      E2: 10300.0
      G12: 4000.0
      nu12: 0.3
      theta_deg: 45.0

  bc:
    corner_eps: 0.0
    displacement_bc_top: false
    displacement_bc_bottom: true
    n_integral: 100
    n_free: 400

  log_fields:
    - Ux
    - Uy
    - Exx
    - Eyy
    - Exy
    - Sxx
    - Syy
    - Sxy

  # <= 0 uses automatic scaling from reference interpolation
  displacement_scale:
    - 0.0
    - 0.0

model:
  net_type: SPINN  # SPINN or PINN
  formulation: mixed

  architecture:
    n_hidden: 3
    width: 32
    rank: 32
    activations: tanh
    initialization: "Glorot uniform"
    mlp_type: mlp

  fourier_features:
    enabled: false
    n_features: 128
    sigma: 10.0

training:
  n_iter: 60000
  lr: 1.0e-3
  num_domain: 10000
  num_test: 10000
  coord_normalization: true
  loss_weights: none
  loss_normalization:
    scheme: none
    n_warmup: 100

  lr_decay: null

  self_attention:
    enabled: false
    init: constant
    update_factor: -1.0
    share_weights: true

  log_every: 250
  generate_video: false

task:
  type: forward  # forward or inverse

  measurements:
    enabled: true
    source: fem  # fem or dic
    type: displacement  # displacement or strain
    n_observations:
      x: 100
      y: 100
    dic:
      region: [0.05, 0.95, 0.20, 0.80]
      path: side_loaded_plate/dic/0.4MP/0noise
      sample_id: 0
    noise_std: 0.0

  inverse:
    normalize_parameters: true

    init_guess:
      isotropic:
        E: 100000.0
        nu: 0.2
      orthotropic:
        E1: 25650.0
        E2: 25650.0
        G12: 5000.0
        nu12: 0.2

    training_factors:
      isotropic:
        E: 1.0
        nu: 1.0
      orthotropic:
        E1: 1.0
        E2: 1.0
        G12: 1.0
        nu12: 1.0

results:
  base_dir: results
  experiment_name: null
  save_on_disk: false

seed: 0